<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=600, height=600, initial-scale=1.0, user-scalable=no" />
  <title>RB Display Shopping List</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="viewport" role="application" aria-label="Shopping list app" tabindex="0">
    <header>
      <h1 id="app-title">Shopping List</h1>
      <div id="controls" role="toolbar" aria-label="Controls">
        <button id="start-voice" aria-pressed="false">Start Voice</button>
        <button id="start-neural" aria-pressed="false">Use Neural</button>
        <button id="add-manual">Type Item</button>
      </div>
    </header>

    <main>
      <ul id="items" role="list" aria-label="Shopping items"></ul>
    </main>

    <footer>
      <div id="instructions" aria-live="polite">
        Focus: Arrow ↑/↓ to navigate, Enter to toggle complete, Delete to remove. 'V' to toggle voice, 'N' to activate neural, 'A' to add manually.
      </div>
    </footer>

    <!-- Hidden manual input used by keyboard-only flows -->
    <div id="hidden-controls" aria-hidden="true">
      <input id="manual-input" type="text" placeholder="Type new item and press Enter" />
      <button id="manual-submit">Add</button>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
